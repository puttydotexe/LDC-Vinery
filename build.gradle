plugins {
    id "architectury-plugin" version "3.5.168"
    id "dev.architectury.loom" version "1.17.491" apply false
    id "dev.architectury.loom-no-remap" version "1.17.491" apply false
    id "com.gradleup.shadow" version "9.6.1" apply false
}

architectury {
    minecraft = rootProject.minecraft_version
}

subprojects {
    if (project.name == "neoforge") {
        apply plugin: "dev.architectury.loom-no-remap"
    } else {
        apply plugin: "dev.architectury.loom"
    }

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"

        if (project.name != "neoforge") {
            mappings files("${rootProject.projectDir}/libs/empty-mappings.jar")
        }
    }
}

allprojects {
    apply plugin: "java"
    apply plugin: "architectury-plugin"
    apply plugin: "maven-publish"

    base {
        archivesName = rootProject.archives_base_name
    }

    version = rootProject.mod_version
    group = rootProject.maven_group

    repositories {
        maven { url "https://maven.neoforged.net/releases" }
        maven { url "https://maven.saps.dev/releases" }
        maven { url 'https://maven.blamejared.com' }

        exclusiveContent {
            forRepository {
                maven {
                    name = "Modrinth"
                    url = "https://api.modrinth.com/maven"
                }
            }

            filter {
                includeGroup "maven.modrinth"
            }
        }

        maven {
            name = "Jared's maven"
            url = "https://maven.blamejared.com/"
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
        options.release = 25
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }

        withSourcesJar()
    }
}